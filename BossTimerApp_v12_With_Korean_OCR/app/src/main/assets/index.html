    <!-- 상단 고정 헤더 -->

            <div class="flex items-center gap-1">

        <!-- 실시간 동기화 상태 및 방 정보 바 -->
        <div class="flex items-center justify-between pt-1.5 border-t border-slate-800/80 text-[11px]">

    <!-- 모바일 세로 최적화 카드 리스트 컨테이너 -->
    <main id="timer-card-list" class="w-full flex-1 flex flex-col gap-2 pb-4">
        <!-- Dynamic Cards Generated by JS -->
    </main>

    <!-- 하단 상태 바 -->
    <footer class="w-full py-2 text-[11px] text-slate-500 flex justify-between items-center border-t border-slate-800/60">
        <span><i class="fa-solid fa-cloud text-cyan-400 mr-1"></i>앱 백그라운드 및 실시간 동기화 지원</span>
        <span id="footer-user-info">미설정</span>
    </footer>

    <!-- Firebase SDK (실시간 데이터베이스 연동용) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getDatabase, ref, set, update, onValue, off } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAzGwcwDog0Q8D94VcVPmiVaSSn3838qCo",
            authDomain: "solybada-a5d96.firebaseapp.com",
            databaseURL: "https://solybada-a5d96-default-rtdb.firebaseio.com",
            projectId: "solybada-a5d96",
            storageBucket: "solybada-a5d96.firebasestorage.app",
            messagingSenderId: "1036138744589",
            appId: "1:1036138744589:web:62c7f0dbca23bc24ed7e44",
            measurementId: "G-N3FZ6C5DBN"
        };

        let db = null;
        let isFirebaseConfigured = false;
        let currentRoomRef = null;

        if (firebaseConfig.apiKey && firebaseConfig.apiKey !== "YOUR_API_KEY" && firebaseConfig.databaseURL && firebaseConfig.databaseURL.startsWith("https://")) {
            try {
                const app = initializeApp(firebaseConfig);
                db = getDatabase(app);
                isFirebaseConfigured = true;
            } catch (e) {
                console.error("Firebase 초기화 실패:", e);
            }
        }

        window.syncEngine = {
            isConfigured: () => isFirebaseConfigured,
            connectRoom: (roomId, onDataUpdate, onStatusChange) => {
                if (!isFirebaseConfigured || !db || !roomId) {
                    onStatusChange(false, "로컬 모드 (Firebase 설정 확인 필요)");
                    return;
                }
                if (currentRoomRef) {
                    off(currentRoomRef);
                }
                const safeRoomId = roomId.replace(/[^a-zA-Z0-9가-힣_-]/g, '');
                currentRoomRef = ref(db, `rooms/${safeRoomId}/bosses`);
                
                onStatusChange(true, `실시간 동기화 중 (${safeRoomId})`);
                
                onValue(currentRoomRef, (snapshot) => {
                    const val = snapshot.val();
                    onDataUpdate(val || {});
                }, (error) => {
                    console.error("DB 읽기 오류:", error);
                    onStatusChange(false, "연결 오류 (DB 규칙/URL 확인)");
                });
            },
            pushBossData: (roomId, bossId, dataObj) => {
                if (!isFirebaseConfigured || !db || !roomId) return;
                const safeRoomId = roomId.replace(/[^a-zA-Z0-9가-힣_-]/g, '');
                const itemRef = ref(db, `rooms/${safeRoomId}/bosses/${bossId}`);
                update(itemRef, dataObj);
            },
            pushAllData: (roomId, allDataObj) => {
                if (!isFirebaseConfigured || !db || !roomId) return;
                const safeRoomId = roomId.replace(/[^a-zA-Z0-9가-힣_-]/g, '');
                const roomRef = ref(db, `rooms/${safeRoomId}/bosses`);
                set(roomRef, allDataObj);
            }
        };

        if (window.startAppAfterFirebase) {
            window.startAppAfterFirebase();
        }
    </script>

    <script>
        const BOSS_LIST = [
            { id: 'bichen', name: '비천용마', icon: 'fa-dragon', interval: 2 * 60 * 60 * 1000, label: '+2h' },
            { id: 'baekam', name: '백암용마', icon: 'fa-dragon', interval: 2 * 60 * 60 * 1000, label: '+2h' },
            { id: 'hyeondo', name: '현도용마', icon: 'fa-dragon', interval: 2 * 60 * 60 * 1000, label: '+2h' },
            { id: 'magye', name: '마계용마', icon: 'fa-dragon', interval: 2 * 60 * 60 * 1000, label: '+2h' },
            { id: 'zombie', name: '좀비왕', icon: 'fa-skull', interval: 2 * 60 * 60 * 1000, label: '+2h' },
            { id: 'hyeondowolf', name: '현도늑대', icon: 'fa-dog', interval: 2 * 60 * 60 * 1000, label: '+2h' },
            { id: 'soyeowolf', name: '소여늑대', icon: 'fa-dog', interval: 2 * 60 * 60 * 1000, label: '+2h' },
            { id: 'neru', name: '네루주술사', icon: 'fa-hat-wizard', interval: 2 * 60 * 60 * 1000, label: '+2h' },
            { id: 'free_centipede', name: '무료 지네', icon: 'fa-bug', interval: 2 * 60 * 60 * 1000, label: '+2h' },
            { id: 'free_lingu', name: '무료 링구', icon: 'fa-ghost', interval: 3 * 60 * 60 * 1000, label: '+3h' },
            { id: 'paid_centipede', name: '유료 지네', icon: 'fa-bug', interval: 2 * 60 * 60 * 1000, label: '+2h' },
            { id: 'paid_lingu', name: '유료 링구', icon: 'fa-ghost', interval: 3 * 60 * 60 * 1000, label: '+3h' }
        ];

        let bossData = {};
        let notifiedMap = {}; 
        let soundEnabled = true;
        let sortByRemaining = false;
        let audioCtx = null;
        let voiceRepeatTimer = null;
        let memoDebounceTimers = {};
        let wakeLock = null;

        let userSettings = {
            roomId: localStorage.getItem('boss_timer_room_id') || '',
            nickname: localStorage.getItem('boss_timer_nickname') || '',
            permChecked: localStorage.getItem('boss_timer_perm_checked') === 'true'
        };

        // =========================================================================
        // [권한 설정 및 네이티브 앱 브릿지 호출 로직]
        // =========================================================================
        function openPermissionModal() {
            document.getElementById('permission-modal').classList.remove('hidden');
        }

        function closePermissionModal() {
            document.getElementById('permission-modal').classList.add('hidden');
        }

        function confirmPermissionsDone() {
            userSettings.permChecked = true;
            localStorage.setItem('boss_timer_perm_checked', 'true');
            closePermissionModal();
            if (!userSettings.roomId || !userSettings.nickname) {
                openSetupModal();
            }
        }

        function requestBatteryOptimization() {
            if (window.AndroidBridge && typeof window.AndroidBridge.requestIgnoreBatteryOptimizations === 'function') {
                window.AndroidBridge.requestIgnoreBatteryOptimizations();
            } else {
                window.location.href = "intent:#Intent;action=android.settings.IGNORE_BATTERY_OPTIMIZATION_SETTINGS;end;";
            }
        }

        function requestOverlayPermission() {
            if (window.AndroidBridge && typeof window.AndroidBridge.requestOverlayPermission === 'function') {
                window.AndroidBridge.requestOverlayPermission();
            } else {
                window.location.href = "intent:#Intent;action=android.settings.action.MANAGE_OVERLAY_PERMISSION;end;";
            }
        }

        function openAppDetailSettings() {
            if (window.AndroidBridge && typeof window.AndroidBridge.openAppSettings === 'function') {
                window.AndroidBridge.openAppSettings();
            } else {
                window.location.href = "intent:#Intent;action=android.settings.SETTINGS;end;";
            }
        }

        // 화면 꺼짐 방지 (Wake Lock API)
        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                }
            } catch (err) {
                console.log('Wake Lock 지원 불가 또는 거절됨:', err);
            }
        }

        document.addEventListener('visibilitychange', async () => {
            if (wakeLock !== null && document.visibilityState === 'visible') {
                await requestWakeLock();
            }
        });

        window.startAppAfterFirebase = function () {
            loadLocalData();
            updateUserBadges();
            renderCards();
            startClockLoop();
            requestWakeLock();
            
            document.body.addEventListener('click', initAudio, { once: true });
            if ('speechSynthesis' in window) {
                window.speechSynthesis.getVoices();
            }

            if (!userSettings.permChecked) {
                openPermissionModal();
            } else if (userSettings.roomId && userSettings.nickname) {
                connectToSyncRoom();
            } else {
                openSetupModal();
            }
        };

        window.onload = function () {
            if (window.syncEngine) {
                window.startAppAfterFirebase();
            }
        };

        function openSetupModal() {
            document.getElementById('input-room-id').value = userSettings.roomId;
            document.getElementById('input-nickname').value = userSettings.nickname;
            document.getElementById('setup-modal').classList.remove('hidden');
        }

        function closeSetupModal() {
            document.getElementById('setup-modal').classList.add('hidden');
        }

        function saveRoomSettings() {
            const roomVal = document.getElementById('input-room-id').value.trim();
            const nickVal = document.getElementById('input-nickname').value.trim();

            if (!roomVal || !nickVal) {
                alert("방 코드와 닉네임을 모두 입력해 주세요.");
                return;
            }

            userSettings.roomId = roomVal;
            userSettings.nickname = nickVal;
            localStorage.setItem('boss_timer_room_id', roomVal);
            localStorage.setItem('boss_timer_nickname', nickVal);

            updateUserBadges();
            closeSetupModal();
            connectToSyncRoom();
        }

        function updateUserBadges() {
            const roomBadge = document.getElementById('current-room-badge');
            const footerInfo = document.getElementById('footer-user-info');
            if (userSettings.roomId) {
                roomBadge.innerText = `방: ${userSettings.roomId}`;
                footerInfo.innerText = `접속자: ${userSettings.nickname || '익명'}`;
            } else {
                roomBadge.innerText = '방 설정';
                footerInfo.innerText = '미설정';
            }
        }

        function connectToSyncRoom() {
            if (!window.syncEngine) return;

            window.syncEngine.connectRoom(
                userSettings.roomId,
                (remoteData) => {
                    BOSS_LIST.forEach(boss => {
                        const rItem = remoteData[boss.id];
                        if (rItem) {
                            if (bossData[boss.id]?.respawnTime !== rItem.respawnTime) {
                                notifiedMap[boss.id] = false;
                            }
                            bossData[boss.id] = {
                                killTime: rItem.killTime || null,
                                respawnTime: rItem.respawnTime || null,
                                memo: rItem.memo || "",
                                updatedBy: rItem.updatedBy || "",
                                reserved: rItem.reserved || false,
                                reservedBy: rItem.reservedBy || ""
                            };
                        } else {
                            bossData[boss.id] = { killTime: null, respawnTime: null, memo: "", updatedBy: "", reserved: false, reservedBy: "" };
                        }

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if ('speechSynthesis' in window) {
                window.speechSynthesis.getVoices();
            }
        }

        function playFallbackChime() {
            try {
                if (!audioCtx) initAudio();
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                const now = audioCtx.currentTime;
                const notes = [880, 1174.66];
                notes.forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.12);
                    gain.gain.setValueAtTime(0.2, now + idx * 0.12);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.12 + 0.25);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + idx * 0.12);
                    osc.stop(now + idx * 0.12 + 0.25);
                });
            } catch (e) {
                console.log("Audio Error:", e);
            }
        }

        function speakCuteAlertOnce() {
            if (window.AndroidBridge && typeof window.AndroidBridge.speak === 'function') {
                window.AndroidBridge.speak("떴숑! 떴숑!");
                return;
            }

            if (!('speechSynthesis' in window)) {
                playFallbackChime();
                return;
            }

            try {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance("떴숑! 떴숑!");
                utterance.lang = 'ko-KR';
                utterance.pitch = 1.95;
                utterance.rate = 1.15;
                utterance.volume = 1.0;

                const voices = window.speechSynthesis.getVoices();
                const koVoices = voices.filter(v => v.lang.includes('ko') || v.lang.includes('KR'));
                if (koVoices.length > 0) {
                    const preferred = koVoices.find(v => 
                        v.name.includes('SunHi') || 
                        v.name.includes('유나') || 
                        v.name.includes('Yuna') || 
                        v.name.includes('Female') ||
                        v.name.includes('Google')
                    );
                    utterance.voice = preferred || koVoices[0];
                }

                window.speechSynthesis.speak(utterance);
            } catch (e) {
                playFallbackChime();
            }
        }

        function playCuteVoiceAlert() {
            if (!soundEnabled) return;

            if (voiceRepeatTimer) {
                clearInterval(voiceRepeatTimer);
                voiceRepeatTimer = null;
            }

            speakCuteAlertOnce();

            let count = 1;
            voiceRepeatTimer = setInterval(() => {
                if (!soundEnabled || count >= 3) {
                    clearInterval(voiceRepeatTimer);
                    voiceRepeatTimer = null;
                    return;
                }
                speakCuteAlertOnce();
                count++;
            }, 1100);
        }

                const data = bossData[boss.id];
                const killEl = document.getElementById(`kill-time-${boss.id}`);

                const memoEl = document.getElementById(`memo-${boss.id}`);
                const recorderEl = document.getElementById(`recorder-${boss.id}`);

                if (killEl) killEl.innerText = formatTimeStr(data.killTime);

        function toggleReserve(bossId) {
            const data = bossData[bossId];
            if (!data || !data.respawnTime) return;

            if (data.reserved) {
                data.reserved = false;
                data.reservedBy = "";
            } else {
                data.reserved = true;
                data.reservedBy = userSettings.nickname || "익명";
            }

            syncBossToCloud(bossId);
            updateDisplay();
        }

        function updateMemo(bossId, value) {
            if (bossData[bossId]) {
                bossData[bossId].memo = value;
                bossData[bossId].updatedBy = userSettings.nickname || "익명";
                saveLocalData();

                clearTimeout(memoDebounceTimers[bossId]);
                memoDebounceTimers[bossId] = setTimeout(() => {
                    syncBossToCloud(bossId);
                }, 400);
            }
        }

        function recordKillTime(bossId) {
            const bossObj = BOSS_LIST.find(b => b.id === bossId);
            if (!bossObj) return;

            const now = Date.now();
            const killTimeStamp = now;
            const respawnTimeStamp = killTimeStamp + bossObj.interval;
            const currentMemo = bossData[bossId]?.memo || "";
            const recorder = userSettings.nickname || "익명";

            notifiedMap[bossId] = false;

            bossData[bossId] = {
                killTime: killTimeStamp,
                respawnTime: respawnTimeStamp,
                memo: currentMemo,
                updatedBy: recorder,
                reserved: false,
                reservedBy: ""
            };

            syncBossToCloud(bossId);
            syncDomWithBossData();

            const killStr = formatTimeStr(killTimeStamp);
            const respawnStr = formatTimeStr(respawnTimeStamp);
            const copyText = `[${bossObj.name}] 처치: ${killStr} / 젠: ${respawnStr}`;
            copyToClipboard(copyText);
        }

        function copyToClipboard(text) {
            if (window.AndroidBridge && typeof window.AndroidBridge.copyToClipboard === 'function') {
                window.AndroidBridge.copyToClipboard(text);
                return;
            }

            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).catch(err => {
                    fallbackCopyTextToClipboard(text);
                });
            } else {
                fallbackCopyTextToClipboard(text);
            }
        }

        function fallbackCopyTextToClipboard(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            textArea.style.left = "-999999px";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                document.execCommand('copy');
            } catch (err) {
                console.error('클립보드 복사 실패:', err);
            }
            document.body.removeChild(textArea);
        }

        function adjustTime(bossId, minutes) {
            if (!bossData[bossId].respawnTime) return;

            bossData[bossId].respawnTime += minutes * 60 * 1000;
            bossData[bossId].updatedBy = userSettings.nickname || "익명";
            if (bossData[bossId].respawnTime > Date.now()) {
                notifiedMap[bossId] = false;
            }

            syncBossToCloud(bossId);
            syncDomWithBossData();
        }

        function resetRow(bossId) {
            bossData[bossId] = { killTime: null, respawnTime: null, memo: "", updatedBy: "", reserved: false, reservedBy: "" };
            notifiedMap[bossId] = false;
            syncBossToCloud(bossId);
            syncDomWithBossData();

                BOSS_LIST.forEach(boss => {
                    bossData[boss.id] = { killTime: null, respawnTime: null, memo: "", updatedBy: "", reserved: false, reservedBy: "" };
                    notifiedMap[boss.id] = false;
                });
                saveLocalData();
                if (window.syncEngine && window.syncEngine.isConfigured() && userSettings.roomId) {
                    window.syncEngine.pushAllData(userSettings.roomId, bossData);
                }
                renderCards();

        function formatTimeStr(timestamp) {
            if (!timestamp) return '-';
            const date = new Date(timestamp);
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            const seconds = String(date.getSeconds()).padStart(2, '0');
            return `${hours}:${minutes}:${seconds}`;
        }

        function startClockLoop() {
            setInterval(() => {
                const now = new Date();
                document.getElementById('system-clock').innerText = 
                    String(now.getHours()).padStart(2, '0') + ':' +
                    String(now.getMinutes()).padStart(2, '0') + ':' +
                    String(now.getSeconds()).padStart(2, '0');

                updateDisplay();
            }, 1000);
        }

        function updateDisplay() {
            const now = Date.now();

            BOSS_LIST.forEach(boss => {
                const data = bossData[boss.id];
                const remainEl = document.getElementById(`remaining-${boss.id}`);
                const cardEl = document.getElementById(`card-${boss.id}`);
                const reserveBtn = document.getElementById(`reserve-btn-${boss.id}`);
                const reserveText = document.getElementById(`reserve-text-${boss.id}`);

                if (!remainEl || !cardEl || !reserveBtn) return;

                if (data.respawnTime) {
                    const diffTime = data.respawnTime - now;

                    if (diffTime <= 10 * 60 * 1000) {
                        if (data.reserved) {
                            reserveBtn.disabled = false;
                            reserveBtn.className = "px-3 py-1 bg-amber-600 active:bg-amber-500 text-white rounded-lg font-bold text-[11px] shadow-md transition flex items-center justify-center gap-1 border border-amber-500";
                            reserveText.innerText = `예약완료(${data.reservedBy})`;
                        } else {
                            reserveBtn.disabled = false;
                            reserveBtn.className = "px-3 py-1 bg-slate-700 active:bg-slate-600 text-slate-200 rounded-lg font-bold text-[11px] shadow-md transition flex items-center justify-center gap-1 border border-slate-600";
                            reserveText.innerText = "예약";
                        }
                    } else {
                        reserveBtn.disabled = true;
                        reserveBtn.className = "px-3 py-1 bg-slate-800 text-slate-600 rounded-lg font-bold text-[11px] shadow-md transition flex items-center justify-center gap-1 cursor-not-allowed border border-slate-800";
                        reserveText.innerText = "예약";
                    }
                } else {
                    reserveBtn.disabled = true;
                    reserveBtn.className = "px-3 py-1 bg-slate-800 text-slate-600 rounded-lg font-bold text-[11px] shadow-md transition flex items-center justify-center gap-1 cursor-not-allowed border border-slate-800";
                    reserveText.innerText = "예약";
                }

                if (!data.respawnTime) {
                    remainEl.innerText = '-';
                    remainEl.className = "font-digit font-black text-lg tracking-tight leading-none text-slate-600";
                    cardEl.className = "glass-panel rounded-xl p-2.5 border border-slate-800/90 shadow-md flex flex-col gap-2 transition";
                    return;
                }

                const diff = data.respawnTime - now;

                if (diff <= 0) {
                    remainEl.innerHTML = `<span class="text-rose-500 text-glow-red animate-pulse text-sm font-sans font-extrabold">
                        <i class="fa-solid fa-triangle-exclamation"></i> 젠 완료!
                    </span>`;
                    cardEl.className = "glass-panel rounded-xl p-2.5 border border-rose-500/60 bg-rose-950/20 shadow-md flex flex-col gap-2 transition";
                    
                    if (!notifiedMap[boss.id]) {
                        playCuteVoiceAlert();
                        notifiedMap[boss.id] = true;
                    }
                } else {
                    const totalSec = Math.floor(diff / 1000);
                    const h = Math.floor(totalSec / 3600);
                    const m = Math.floor((totalSec % 3600) / 60);
                    const s = totalSec % 60;

                    const formattedRemain = 
                        String(h).padStart(2, '0') + ':' +
                        String(m).padStart(2, '0') + ':' +
                        String(s).padStart(2, '0');

                    remainEl.innerText = formattedRemain;

                    if (diff <= 10 * 60 * 1000) {
                        remainEl.className = "font-digit font-black text-lg tracking-tight leading-none text-amber-400 text-glow-amber animate-pulse";
                        cardEl.className = "glass-panel rounded-xl p-2.5 border border-amber-500/50 bg-amber-950/15 shadow-md flex flex-col gap-2 transition";
                    } else {
                        remainEl.className = "font-digit font-black text-lg tracking-tight leading-none text-emerald-400 text-glow-green";
                        cardEl.className = "glass-panel rounded-xl p-2.5 border border-cyan-900/50 shadow-md flex flex-col gap-2 transition";
                    }
                }
            });
        }

        const lastAutoKillTimestamps = {};
        const AUTO_KILL_COOLDOWN_MS = 60000; 

        window.handleOcrDetectedText = function(ocrText) {
            if (!ocrText || typeof ocrText !== 'string') return false;

            const normalizedText = ocrText.trim();

            for (const rule of DROP_LOG_RULES) {
                const match = normalizedText.match(rule.pattern);
                if (match) {
                    const matchedSentence = match[0].replace(/\s+/g, '');

                    if (processedDropLogs.has(matchedSentence)) {
                        return false;
                    }

                    const now = Date.now();
                    const lastKillTime = bossData[rule.bossId]?.killTime || 0;
                    const lastAutoTime = lastAutoKillTimestamps[rule.bossId] || 0;

                    if (now - lastKillTime < AUTO_KILL_COOLDOWN_MS || now - lastAutoTime < AUTO_KILL_COOLDOWN_MS) {
                        processedDropLogs.add(matchedSentence);
                        return false;
                    }

                    processedDropLogs.add(matchedSentence);
                    lastAutoKillTimestamps[rule.bossId] = now;
                    recordKillTime(rule.bossId);
                    console.log(`[자동 처치 1회 실행 완료] 보스 ID: ${rule.bossId} / 원문: ${match[0]}`);
                    return true;
                }
            }
            return false;
        };

        window.addEventListener('message', (event) => {
            if (event.data && typeof event.data === 'object' && event.data.type === 'OCR_LOG') {
                window.handleOcrDetectedText(event.data.text);
            } else if (typeof event.data === 'string') {
                window.handleOcrDetectedText(event.data);
            }
        });

        (function checkUrlOcrParam() {
            const params = new URLSearchParams(window.location.search);
            const ocrParam = params.get('ocr');
            if (ocrParam) {
                setTimeout(() => window.handleOcrDetectedText(decodeURIComponent(ocrParam)), 500);
            }
        })();
    </script>
</body>
